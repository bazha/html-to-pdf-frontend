# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration — reviews every pull request automatically once the
# CodeRabbit GitHub App is installed on this repo. See https://docs.coderabbit.ai
language: en-US
early_access: false

reviews:
  # "chill" = focus on substantive issues; "assertive" = more nitpicks.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Run on every PR targeting these branches.
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  # Skip generated / vendored / lockfile noise.
  path_filters:
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/coverage/**"
    - "!package-lock.json"

  # Project-specific guidance — mirrors the invariants in CLAUDE.md.
  path_instructions:
    - path: "src/hooks/**"
      instructions: >-
        Hooks are state-machine driven (discriminated unions). Flag any state
        transition that isn't represented in the union. Keep layering one-way:
        hooks must not import from components/.
    - path: "src/api/pdfClient.ts"
      instructions: >-
        This is the only file allowed to call fetch. Errors must be thrown as
        ApiError with a discriminated code ('validation' | 'rate_limit' |
        'http' | 'network'). Flag any consumer that pattern-matches on raw HTTP
        status instead of code.
    - path: "src/types/pdfOptions.ts"
      instructions: >-
        Single source of truth for PDF option shape, defaults, and literal
        arrays. Flag any option literal ('A4', 'normal', '{pageNumber}', etc.)
        re-declared inline elsewhere instead of derived from here.
    - path: "src/**/*.test.{ts,tsx}"
      instructions: >-
        Tests use Vitest + @testing-library/react + jsdom, with msw for backend
        mocking and fake timers for interval/timeout-driven hooks. Prefer
        behavior assertions over implementation details.

  # Static-analysis tools CodeRabbit should run as part of the review.
  tools:
    eslint:
      enabled: true
    prettier:
      enabled: true
    actionlint:
      enabled: true

chat:
  auto_reply: true
